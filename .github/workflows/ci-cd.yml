name: CI/CD

on:
  push:
    branches:
      - developer
      - main
  pull_request:
    branches:
      - developer
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: horas-complementares
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: horas-complementares/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Testes
        run: npm test --if-present

      - name: Build
        run: npm run build

  deploy-hml:
    name: Deploy HML
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/developer'
    runs-on: ubuntu-latest
    environment:
      name: hml
      url: https://${{ vars.HML_DOMAIN }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HML_DOMAIN: ${{ vars.HML_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: horas-complementares/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Vercel pull
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Vercel build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Vercel deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Apontar dominio de HML
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "$HML_DOMAIN" --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

  deploy-prod:
    name: Deploy PROD
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: horas-complementares/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Vercel pull
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Vercel build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Vercel deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
